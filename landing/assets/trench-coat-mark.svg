<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Trench Coat mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141f"/>
      <stop offset="100%" stop-color="#0a0b14"/>
    </linearGradient>
    <linearGradient id="wash" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6b8f7a" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c9a227" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8aa896" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#wash)"/>
  <!-- Collar -->
  <path d="M44 34c6-8 14-12 20-12s14 4 20 12l-8 8c-3-3-7-5-12-5s-9 2-12 5l-8-8z"
        fill="none" stroke="#e8e0d5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Coat body -->
  <path d="M40 42c2 4 4 10 5 18 1 10 1 22 1 34h36c0-12 0-24 1-34 1-8 3-14 5-18
           -4 2-10 4-18 4s-14-2-18-4z"
        fill="none" stroke="#e8e0d5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lapels -->
  <path d="M52 44l12 16 12-16" fill="none" stroke="#c9a227" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Center seam -->
  <path d="M64 60v34" fill="none" stroke="#6b8f7a" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <!-- Soft fog dots -->
  <circle cx="30" cy="92" r="3" fill="#8aa896" opacity="0.25" filter="url(#soft)"/>
  <circle cx="98" cy="40" r="4" fill="#c9a227" opacity="0.18" filter="url(#soft)"/>
  <circle cx="104" cy="88" r="2.5" fill="#e8e0d5" opacity="0.12"/>
</svg>
